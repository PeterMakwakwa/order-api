name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, format, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Order.slnx

      - name: Check formatting (.editorconfig)
        run: dotnet format Order.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build Order.slnx --configuration Release --no-restore

      # Includes the SQL Server integration tests: ubuntu runners have Docker, so Testcontainers starts SQL Server
      # and grate deploys src/dbOrder exactly as docker-compose does.
      - name: Test
        run: >
          dotnet test Order.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Fail on vulnerable packages
        run: |
          dotnet list Order.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the log above)."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker-image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --file build/docker/Dockerfile --tag order-api:${{ github.sha }} .
